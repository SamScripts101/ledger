name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # GitHub Pages project sites are served from /<repo-name>/, so Expo's
      # generated asset URLs need that prefix. Patched here only — the
      # committed app.json stays unprefixed so local dev (native + web) is
      # unaffected.
      - name: Set baseUrl for the Pages subpath
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.experiments = { ...app.expo.experiments, baseUrl: '/${{ github.event.repository.name }}' };
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      - run: npx expo export -p web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
